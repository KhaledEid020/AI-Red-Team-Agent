[project]
name = "nua-security-agent"
version = "0.1.0"
description = "Security Assessment Agent using LangGraph and MCP"
authors = [
    { name = "Cyber", email = "cyber@example.com" }
]
dependencies = [
    "langgraph",
    "langgraph-sdk",
    "langgraph-cli[inmem]",
    "langchain-openai",
    "langchain-mcp-adapters",
    "deepagents",
    "python-dotenv",
]
readme = "README.md"
requires-python = ">=3.12"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
